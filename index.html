<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRYOUT · 소개 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Bebas+Neue&family=Anton&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1B2A4A; --navy-mid: #1e3260;
  --pink: #F0406A; --border: rgba(27,42,74,0.12);
  --text: #1B2A4A; --muted: #8a7f72;
}
body {
  background: #fdf3ea; color: var(--text);
  font-family: 'Pretendard','Noto Sans KR',sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 28px 14px 60px; gap: 24px;
}

/* HEADER */
.header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logo-tryout { font-family: 'Anton', sans-serif; font-size: 48px; letter-spacing: 6px; color: #1B2A4A; -webkit-text-stroke: 2px var(--pink); line-height: 1; }
.logo-tryout span { color: var(--pink); -webkit-text-stroke: 0; }
.logo-sub { font-size: 10px; letter-spacing: 4px; color: #8a7f72; text-transform: uppercase; }

/* TOOLBAR */
.cast-toolbar { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 960px; flex-wrap: wrap; justify-content: space-between; }
.btn-add { display: flex; align-items: center; gap: 7px; background: linear-gradient(90deg, var(--pink), #d42d5a); border: none; border-radius: 10px; color: #fff; font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 3px; cursor: pointer; padding: 11px 20px; box-shadow: 0 4px 16px rgba(240,64,106,0.3); -webkit-tap-highlight-color: transparent; }
.btn-add:active { transform: scale(0.97); }
.btn-clear-all { background: transparent; border: 1.5px solid rgba(27,42,74,0.2); border-radius: 10px; color: rgba(27,42,74,0.45); font-family: 'Pretendard', sans-serif; font-size: 12px; cursor: pointer; padding: 11px 16px; }

/* CAST GRID */
.cast-grid { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; width: 100%; max-width: 960px; }
.cast-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cast-item-actions { display: flex; gap: 6px; }
.cast-item-actions button { border: none; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 11px; padding: 6px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-edit-cast { background: var(--navy); color: #fff; }
.btn-dl-cast { background: rgba(240,64,106,0.15); color: var(--pink); border: 1px solid rgba(240,64,106,0.3) !important; }
.btn-del-cast { background: rgba(27,42,74,0.08); color: rgba(27,42,74,0.45); }
.cast-empty { text-align: center; padding: 48px 20px; color: rgba(27,42,74,0.3); font-size: 14px; letter-spacing: 1px; }
.cast-empty .empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }

/* 사진 조정 힌트 */
.photo-hint { font-size: 10px; color: rgba(27,42,74,0.4); text-align: center; letter-spacing: 0.5px; margin-top: -4px; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal-inner { background: #fdf3ea; border-radius: 20px; padding: 20px 14px 32px; width: 100%; max-width: 420px; margin: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; position: relative; }
.modal-close { position: absolute; top: 14px; right: 16px; background: rgba(27,42,74,0.08); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--navy); display: flex; align-items: center; justify-content: center; }

/* CARD */
.card {
  width: 300px; height: 520px; border-radius: 10px;
  overflow: hidden; position: relative; flex-shrink: 0;
  box-shadow: 0 0 0 1.5px rgba(27,42,74,0.15), 4px 4px 0 rgba(27,42,74,0.08), 0 16px 40px rgba(27,42,74,0.25);
}
.card-stripe { position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 6; display: flex; pointer-events: none; }
.card-stripe-left { flex: 1; }
.card-stripe-right { flex: 1; }
.card-tag { position: absolute; top: 16px; left: 0; z-index: 6; padding: 4px 14px 4px 12px; clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 3px; color: #fff; pointer-events: none; }
.card-number-badge { position: absolute; top: 12px; right: 14px; z-index: 6; font-family: 'Anton', sans-serif; font-size: 48px; line-height: 1; color: rgba(255,255,255,0.08); letter-spacing: -2px; pointer-events: none; }
.photo-area { position: absolute; inset: 0; overflow: hidden; background: #111; cursor: grab; }
.photo-area:active { cursor: grabbing; }
.photo-area img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; transform-origin: center top; user-select: none; -webkit-user-drag: none; touch-action: none; }
.gradient-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.photo-empty { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.photo-empty svg { opacity: 0.25; }
.photo-empty span { font-size: 10px; color: var(--muted); letter-spacing: 2px; }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px 24px; display: flex; flex-direction: column; justify-content: flex-end; z-index: 5; pointer-events: none; }
.card-position { font-family: 'Black Han Sans', sans-serif; font-size: 9px; letter-spacing: 3px; }
.card-name { font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 1px; line-height: 1; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.card-age-job { font-family: 'Pretendard', sans-serif; font-size: 10px; color: rgba(255,255,255,0.8); letter-spacing: 1px; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card-divider { height: 1px; margin: 4px 0; }
.card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.stat-row { display: flex; align-items: center; gap: 4px; }
.stat-lbl { font-family: 'Black Han Sans', sans-serif; font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,0.95); width: 28px; flex-shrink: 0; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.card-logo { text-align: right; font-family: 'Black Han Sans', sans-serif; font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.18); margin-top: 4px; }
.card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255,255,255,0.2) 0%, transparent 50%); z-index: 9; pointer-events: none; }

/* PANEL */
.panel { width: 100%; max-width: 400px; background: #faf7f2; border: 1px solid rgba(27,42,74,0.1); border-radius: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 20px; }
.sec-title { font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid rgba(27,42,74,0.1); margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: rgba(27,42,74,0.5); }
input[type=text], input[type=number] { background: #fff; border: 1px solid rgba(27,42,74,0.15); border-radius: 8px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; padding: 10px 12px; outline: none; width: 100%; -webkit-appearance: none; }
input[type=text]:focus, input[type=number]:focus { border-color: var(--pink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.color-field { display: flex; align-items: center; gap: 8px; }
.color-field label { font-size: 11px; color: rgba(27,42,74,0.5); width: 58px; flex-shrink: 0; margin: 0; }
input[type=color] { width: 36px; height: 34px; border: 1px solid rgba(27,42,74,0.15); border-radius: 6px; padding: 2px; background: #fff; cursor: pointer; flex-shrink: 0; -webkit-appearance: none; }
.hex-inp { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; padding: 8px 10px; outline: none; }
.hex-inp:focus { border-color: var(--pink); }
.col-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(27,42,74,0.15); flex-shrink: 0; }
.upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; background: rgba(27,42,74,0.03); border: 1.5px dashed rgba(27,42,74,0.2); border-radius: 12px; cursor: pointer; font-size: 14px; color: rgba(27,42,74,0.45); letter-spacing: 1px; min-height: 64px; }
.upload-label.loaded { border-color: rgba(27,42,74,0.25); background: rgba(27,42,74,0.04); }
.thumb-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.photo-thumb { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.thumb-text { flex: 1; font-size: 12px; color: rgba(27,42,74,0.55); }
.btn-remove { background: rgba(240,64,106,0.2); border: none; border-radius: 6px; color: var(--pink); font-size: 12px; padding: 5px 10px; cursor: pointer; }
.stat-ctrl-row { display: flex; align-items: center; gap: 10px; }
.stat-ctrl-label { font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 1px; color: rgba(27,42,74,0.55); width: 50px; flex-shrink: 0; }
.stat-boxes { display: flex; gap: 5px; }
.stat-box { width: 34px; height: 34px; border: 1.5px solid rgba(27,42,74,0.2); border-radius: 7px; cursor: pointer; background: rgba(27,42,74,0.04); transition: background 0.12s, border-color 0.12s; }
.stat-box.on { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px rgba(240,64,106,0.5); }
.btn-dl { width: 100%; padding: 15px; background: linear-gradient(90deg, var(--pink), #d42d5a); border: none; border-radius: 12px; color: #fff; font-family: 'Black Han Sans', sans-serif; font-size: 15px; letter-spacing: 4px; cursor: pointer; box-shadow: 0 4px 20px rgba(240,64,106,0.35); }
</style>
</head>
<body>

<div class="header">
  <div class="logo-tryout">TRY<span>&#9825;</span>UT</div>
  <div class="logo-sub">너와의 첫 매치를 시작합니다 · Profile Card</div>
</div>

<div class="cast-toolbar">
  <button class="btn-add" onclick="openModal()">＋ 출연자 추가</button>
  <button class="btn-clear-all" onclick="clearAll()">전체 초기화</button>
</div>

<div class="cast-grid" id="castGrid">
  <div class="cast-empty" id="castEmpty">
    <span class="empty-icon">&#9825;</span>
    출연자를 추가해 보세요
  </div>
</div>

<!-- MODAL (정보/색상/스탯/사진 업로드만) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div class="panel" style="box-shadow:none;border:none;background:transparent;padding:40px 0 0;">
      <div>
        <div class="sec-title">기본 정보</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
          <div class="field"><label>이름</label><input type="text" id="iName" value=""></div>
          <div class="row2">
            <div class="field"><label>나이</label><input type="number" id="iAge" value="" min="20" max="40"></div>
            <div class="field"><label>키 (cm)</label><input type="number" id="iHeight" value="" min="150" max="200"></div>
          </div>
          <div class="field"><label>직업</label><input type="text" id="iJob" value=""></div>
          <div class="row2">
            <div class="field"><label>등번호</label><input type="text" id="iNum" value=""></div>
            <div class="field"><label>프로그램명</label><input type="text" id="iShow" value="TRYOUT : LOVE"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title">카드 색상</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          <div class="color-field">
            <label>메인</label>
            <input type="color" id="c1p" value="#F0406A" oninput="pickerChange('c1',this.value)">
            <input type="text" class="hex-inp" id="c1h" value="#F0406A" oninput="hexChange('c1',this.value)" maxlength="7">
            <div class="col-dot" id="c1d" style="background:#F0406A"></div>
          </div>
          <div class="color-field">
            <label>포인트</label>
            <input type="color" id="c2p" value="#1B2A4A" oninput="pickerChange('c2',this.value)">
            <input type="text" class="hex-inp" id="c2h" value="#1B2A4A" oninput="hexChange('c2',this.value)" maxlength="7">
            <div class="col-dot" id="c2d" style="background:#1B2A4A"></div>
          </div>
          <div class="color-field">
            <label>배경</label>
            <input type="color" id="cbp" value="#f5f0e8" oninput="pickerChange('cb',this.value)">
            <input type="text" class="hex-inp" id="cbh" value="#f5f0e8" oninput="hexChange('cb',this.value)" maxlength="7">
            <div class="col-dot" id="cbd" style="background:#f5f0e8"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title">사진</div>
        <div style="margin-top:10px;">
          <label class="upload-label" id="uploadLabel" for="fileInput">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>탭하여 사진 선택</span>
          </label>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileChange(this)">
        </div>
        <p style="font-size:11px;color:rgba(27,42,74,0.4);text-align:center;margin-top:8px;line-height:1.6;">저장 후 카드에서 직접<br>드래그 · 핀치로 사진 위치 조절하세요</p>
      </div>
      <div>
        <div class="sec-title">스탯</div>
        <div id="statWrap" style="display:flex;flex-direction:column;gap:9px;margin-top:10px;"></div>
      </div>
      <button class="btn-dl" onclick="saveAndClose()">&#10004; 저장</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var mCol = { c1:'#F0406A', c2:'#1B2A4A', cb:'#f5f0e8' };
var mPhotoUrl = null;
var castList = [];
var editingIdx = -1;

var STATS = [
  {key:'body',  lbl:'신체', val:0},
  {key:'agil',  lbl:'민첩', val:0},
  {key:'focus', lbl:'집중', val:0},
  {key:'skill', lbl:'기술', val:0},
  {key:'luck',  lbl:'행운', val:0}
];

/* stat boxes */
var swrap = document.getElementById('statWrap');
STATS.forEach(function(s, i) {
  var d = document.createElement('div');
  d.className = 'stat-ctrl-row';
  var boxes = '';
  for (var n = 1; n <= 5; n++)
    boxes += '<div class="stat-box'+(n<=s.val?' on':'')+'" onclick="setStat('+i+','+n+')" id="box_'+s.key+'_'+n+'"></div>';
  d.innerHTML = '<span class="stat-ctrl-label">'+s.lbl+'</span><div class="stat-boxes">'+boxes+'</div>';
  swrap.appendChild(d);
});

function setStat(i, v) {
  STATS[i].val = v;
  for (var n = 1; n <= 5; n++) {
    var el = document.getElementById('box_'+STATS[i].key+'_'+n);
    if (el) el.className = 'stat-box'+(n<=v?' on':'');
  }
}

function validHex(h) { return /^#[0-9A-Fa-f]{6}$/.test(h); }
function pickerChange(k, v) {
  mCol[k] = v;
  document.getElementById(k+'h').value = v;
  document.getElementById(k+'d').style.background = v;
}
function hexChange(k, raw) {
  var v = raw.trim();
  if (v && v[0] !== '#') v = '#'+v;
  if (validHex(v)) { mCol[k]=v; document.getElementById(k+'p').value=v; document.getElementById(k+'d').style.background=v; }
}

function onFileChange(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    mPhotoUrl = e.target.result;
    var lbl = document.getElementById('uploadLabel');
    lbl.classList.add('loaded');
    lbl.innerHTML = '<div class="thumb-row"><img class="photo-thumb" src="'+mPhotoUrl+'"><span class="thumb-text">사진 변경하려면 탭</span><button class="btn-remove" onclick="clearModalPhoto(event)">제거</button></div>';
  };
  reader.readAsDataURL(file);
}
function clearModalPhoto(e) {
  e.preventDefault();
  mPhotoUrl = null;
  document.getElementById('fileInput').value = '';
  var lbl = document.getElementById('uploadLabel');
  lbl.classList.remove('loaded');
  lbl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>탭하여 사진 선택</span>';
}

/* ─── 저장/로드 ─── */
function loadCast() {
  try { var s = localStorage.getItem('tryout_cast'); if (s) castList = JSON.parse(s); } catch(e) { castList = []; }
}
function saveCast() {
  try { localStorage.setItem('tryout_cast', JSON.stringify(castList)); } catch(e) {}
}

/* ─── 모달 ─── */
function openModal(idx) {
  editingIdx = (idx !== undefined) ? idx : -1;
  var d = editingIdx >= 0 ? castList[editingIdx] : null;

  document.getElementById('iName').value   = d ? d.name   : '';
  document.getElementById('iAge').value    = d ? d.age    : '24';
  document.getElementById('iHeight').value = d ? d.height : '168';
  document.getElementById('iJob').value    = d ? d.job    : '';
  document.getElementById('iNum').value    = d ? d.num    : '01';
  document.getElementById('iShow').value   = d ? d.show   : 'TRYOUT 2026';

  mCol = { c1: d?d.c1:'#F0406A', c2: d?d.c2:'#1B2A4A', cb: d?d.cb:'#f5f0e8' };
  ['c1','c2','cb'].forEach(function(k) {
    var p=document.getElementById(k+'p'), h=document.getElementById(k+'h'), dot=document.getElementById(k+'d');
    if(p) p.value=mCol[k]; if(h) h.value=mCol[k]; if(dot) dot.style.background=mCol[k];
  });

  mPhotoUrl = d ? (d.photo||null) : null;
  var lbl = document.getElementById('uploadLabel');
  if (mPhotoUrl) {
    lbl.classList.add('loaded');
    lbl.innerHTML = '<div class="thumb-row"><img class="photo-thumb" src="'+mPhotoUrl+'"><span class="thumb-text">사진 변경하려면 탭</span><button class="btn-remove" onclick="clearModalPhoto(event)">제거</button></div>';
  } else {
    lbl.classList.remove('loaded');
    lbl.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>탭하여 사진 선택</span>';
  }
  document.getElementById('fileInput').value = '';

  if (d && d.stats) STATS.forEach(function(s,i){ setStat(i, d.stats[i]!==undefined?d.stats[i]:s.val); });
  else STATS.forEach(function(s,i){ setStat(i,s.val); });

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function saveAndClose() {
  var data = {
    name:   document.getElementById('iName').value || '이름없음',
    age:    document.getElementById('iAge').value,
    height: document.getElementById('iHeight').value,
    job:    document.getElementById('iJob').value,
    num:    document.getElementById('iNum').value || '01',
    show:   document.getElementById('iShow').value || 'TRYOUT 2026',
    c1: mCol.c1, c2: mCol.c2, cb: mCol.cb,
    photo: mPhotoUrl || null,
    imgX: 0, imgY: 0, imgScale: 1,
    stats: STATS.map(function(s){ return s.val; })
  };
  // 수정 시 기존 imgX/Y/Scale 유지
  if (editingIdx >= 0) {
    var old = castList[editingIdx];
    if (old && mPhotoUrl === old.photo) {
      data.imgX = old.imgX||0; data.imgY = old.imgY||0; data.imgScale = old.imgScale||1;
    }
    castList[editingIdx] = data;
  } else {
    castList.push(data);
  }
  saveCast();
  renderGrid();
  closeModal();
}

function deleteCard(idx) {
  if (!confirm('이 출연자를 삭제할까요?')) return;
  castList.splice(idx,1); saveCast(); renderGrid();
}
function clearAll() {
  if (!castList.length) return;
  if (!confirm('모든 출연자를 초기화할까요?')) return;
  castList=[]; saveCast(); renderGrid();
}

/* ─── 그리드 렌더링 ─── */
function renderGrid() {
  var grid = document.getElementById('castGrid');
  var empty = document.getElementById('castEmpty');
  if (!castList.length) { grid.innerHTML=''; grid.appendChild(empty); return; }
  grid.innerHTML = '';
  castList.forEach(function(d, idx) {
    var item = document.createElement('div');
    item.className = 'cast-item';

    var cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.id = 'castcard_'+idx;
    cardEl.style.background = d.cb;
    cardEl.innerHTML = buildCardHTML(d, idx);
    applyGradient(cardEl, d);
    attachDrag(cardEl, idx);

    item.appendChild(cardEl);
    if (d.photo) {
      var hint = document.createElement('div');
      hint.className = 'photo-hint';
      hint.textContent = '드래그·핀치로 사진 위치 조절';
      item.appendChild(hint);
    }
    var actions = document.createElement('div');
    actions.className = 'cast-item-actions';
    actions.innerHTML =
      '<button class="btn-edit-cast" onclick="openModal('+idx+')">수정</button>'+
      '<button class="btn-dl-cast" onclick="downloadCard('+idx+')">&#11015; 저장</button>'+
      '<button class="btn-del-cast" onclick="deleteCard('+idx+')">삭제</button>';
    item.appendChild(actions);
    grid.appendChild(item);
  });
}

function buildCardHTML(d, idx) {
  var numStr = String(d.num).length<2 ? '0'+d.num : String(d.num);
  var photoHtml = d.photo
    ? '<img id="cimg_'+idx+'" src="'+d.photo+'" style="transform:translate('+(d.imgX||0)+'px,'+(d.imgY||0)+'px) scale('+(d.imgScale||1)+')">'
    : '<div class="photo-empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M3 20c0-3 3-5 9-5s9 2 9 5"/></svg><span style="color:rgba(255,255,255,0.4);">사진없음</span></div>';

  var c1=d.c1;
  var statsHtml='';
  if(d.stats){
    var LBLS=['신체','민첩','집중','기술','행운'];
    for(var i=0;i<5;i++){
      var v=d.stats[i]||0, hearts='';
      for(var n=1;n<=5;n++) hearts+='<span style="font-size:13px;color:'+(n<=v?c1:'rgba(255,255,255,0.2)')+';">'+(n<=v?'♥':'♡')+'</span>';
      statsHtml+='<div class="stat-row"><span class="stat-lbl">'+LBLS[i]+'</span><span style="display:flex;gap:1px;">'+hearts+'</span></div>';
    }
  }

  return '<div class="card-stripe"><div class="card-stripe-left" style="background:'+d.c1+'"></div><div class="card-stripe-right" style="background:'+d.c2+'"></div></div>'+
    '<div class="card-tag" style="background:'+d.c1+'">'+d.show+'</div>'+
    '<div class="card-number-badge">'+numStr+'</div>'+
    '<div class="photo-area" id="cpa_'+idx+'">'+photoHtml+'</div>'+
    '<div class="gradient-overlay" id="cgo_'+idx+'"></div>'+
    '<div class="card-info">'+
      '<div class="card-position" style="color:'+d.c1+'">NO. '+numStr+' · '+d.show+'</div>'+
      '<div style="height:3px;"></div>'+
      '<div class="card-name">'+d.name+'</div>'+
      '<div style="height:4px;"></div>'+
      '<div class="card-age-job"><span>'+d.age+'세</span><span style="opacity:0.4;">·</span><span>'+d.job+'</span><span style="opacity:0.4;">·</span><span>'+d.height+'cm</span></div>'+
      '<div style="height:6px;"></div>'+
      '<div class="card-divider" style="background:linear-gradient(90deg,'+d.c1+' 0%,rgba(255,255,255,0.15) 70%,transparent 100%);"></div>'+
      '<div style="height:4px;"></div>'+
      '<div class="card-stats">'+statsHtml+'</div>'+
      '<div class="card-logo">'+d.show+'</div>'+
    '</div>';
}

function applyGradient(cardEl, d) {
  var go = cardEl.querySelector('.gradient-overlay');
  if (!go) return;
  var r=parseInt(d.cb.slice(1,3),16), g=parseInt(d.cb.slice(3,5),16), b=parseInt(d.cb.slice(5,7),16);
  function rgba(a){ return 'rgba('+r+','+g+','+b+','+a+')'; }
  go.style.background = 'linear-gradient(to bottom,'+rgba(0)+' 0%,'+rgba(0)+' 40%,'+rgba(0.15)+' 52%,'+rgba(0.5)+' 65%,'+rgba(0.85)+' 80%,'+rgba(0.97)+' 100%)';
}

/* ─── 그리드 카드에서 직접 드래그/핀치 ─── */
function attachDrag(cardEl, idx) {
  var pa = cardEl.querySelector('.photo-area');
  if (!pa || !castList[idx].photo) return;

  var dragStart = null, lastDist = 0;

  pa.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var d = castList[idx];
    dragStart = {x: e.clientX-(d.imgX||0), y: e.clientY-(d.imgY||0)};
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
  function onMouseMove(e) {
    if (!dragStart) return;
    castList[idx].imgX = e.clientX - dragStart.x;
    castList[idx].imgY = e.clientY - dragStart.y;
    updateImgTransform(idx);
  }
  function onMouseUp() {
    dragStart = null;
    saveCast();
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }

  pa.addEventListener('wheel', function(e) {
    e.preventDefault();
    castList[idx].imgScale = Math.min(5, Math.max(0.2, (castList[idx].imgScale||1) * (e.deltaY>0?0.92:1.08)));
    updateImgTransform(idx);
    saveCast();
  }, {passive: false});

  pa.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var d = castList[idx];
    if (e.touches.length===1) {
      dragStart = {x: e.touches[0].clientX-(d.imgX||0), y: e.touches[0].clientY-(d.imgY||0)};
    } else if (e.touches.length===2) {
      dragStart = null;
      lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:false});

  pa.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length===1 && dragStart) {
      castList[idx].imgX = e.touches[0].clientX - dragStart.x;
      castList[idx].imgY = e.touches[0].clientY - dragStart.y;
      updateImgTransform(idx);
    } else if (e.touches.length===2) {
      var dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if (lastDist>0) castList[idx].imgScale = Math.min(5, Math.max(0.2, (castList[idx].imgScale||1)*(dist/lastDist)));
      lastDist = dist;
      updateImgTransform(idx);
    }
  }, {passive:false});

  pa.addEventListener('touchend', function() { dragStart=null; lastDist=0; saveCast(); });
}

function updateImgTransform(idx) {
  var img = document.getElementById('cimg_'+idx);
  if (!img) return;
  var d = castList[idx];
  img.style.transform = 'translate('+(d.imgX||0)+'px,'+(d.imgY||0)+'px) scale('+(d.imgScale||1)+')';
}

/* ─── 저장: Canvas 직접 렌더링 (html2canvas 미사용) ─── */
function drawCover(ctx, img, x, y, w, h) {
  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;
  var scale = Math.max(w / iw, h / ih);
  var sw = w / scale;
  var sh = h / scale;
  // imgX/Y/Scale 변환값을 반영: 사용자가 드래그/줌한 위치 그대로
  var sx = (iw - sw) / 2;
  var sy = (ih - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawCoverTransformed(ctx, img, x, y, w, h, imgX, imgY, imgScale) {
  // cover 기반 + 사용자 transform 반영
  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;
  var baseSc = Math.max(w / iw, h / ih);
  var sw = w / baseSc;
  var sh = h / baseSc;
  var sx = (iw - sw) / 2 - imgX / baseSc;
  var sy = (ih - sh) / 2 - imgY / baseSc;
  var drawW = w / imgScale;
  var drawH = h / imgScale;
  var drawSW = drawW / baseSc;
  var drawSH = drawH / baseSc;
  var drawSX = (iw - drawSW) / 2 - imgX / baseSc;
  var drawSY = (ih - drawSH) / 2 - imgY / baseSc;
  ctx.drawImage(img, drawSX, drawSY, drawSW, drawSH, x, y, w, h);
}

function downloadCard(idx) {
  var d = castList[idx];
  if (!d) return;

  var SC = 3, W = 300, H = 520;
  var canvas = document.createElement('canvas');
  canvas.width = W * SC; canvas.height = H * SC;
  var ctx = canvas.getContext('2d');
  ctx.scale(SC, SC);

  function render(photoImg) {
    // 1. 배경
    ctx.fillStyle = d.cb;
    ctx.fillRect(0, 0, W, H);

    // 2. 사진 (cover + 사용자 transform)
    if (photoImg) {
      ctx.save();
      // 카드 모서리 클립
      var r = 10;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(W-r,0); ctx.arcTo(W,0,W,r,r);
      ctx.lineTo(W,H-r); ctx.arcTo(W,H,W-r,H,r);
      ctx.lineTo(r,H); ctx.arcTo(0,H,0,H-r,r);
      ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r);
      ctx.closePath(); ctx.clip();
      drawCoverTransformed(ctx, photoImg, 0, 0, W, H, d.imgX||0, d.imgY||0, d.imgScale||1);
      ctx.restore();
    }

    // 3. 모서리 클립 (텍스트 레이어용)
    ctx.save();
    var r = 10;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(W-r,0); ctx.arcTo(W,0,W,r,r);
    ctx.lineTo(W,H-r); ctx.arcTo(W,H,W-r,H,r);
    ctx.lineTo(r,H); ctx.arcTo(0,H,0,H-r,r);
    ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r);
    ctx.closePath(); ctx.clip();

    // 4. 그라디언트 오버레이
    var rv=parseInt(d.cb.slice(1,3),16), gv=parseInt(d.cb.slice(3,5),16), bv=parseInt(d.cb.slice(5,7),16);
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,   'rgba('+rv+','+gv+','+bv+',0)');
    grad.addColorStop(0.40,'rgba('+rv+','+gv+','+bv+',0)');
    grad.addColorStop(0.52,'rgba('+rv+','+gv+','+bv+',0.15)');
    grad.addColorStop(0.65,'rgba('+rv+','+gv+','+bv+',0.5)');
    grad.addColorStop(0.80,'rgba('+rv+','+gv+','+bv+',0.85)');
    grad.addColorStop(1,   'rgba('+rv+','+gv+','+bv+',0.97)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 5. 상단 스트라이프
    ctx.fillStyle = d.c1; ctx.fillRect(0, 0, W/2, 8);
    ctx.fillStyle = d.c2; ctx.fillRect(W/2, 0, W/2, 8);

    // 6. 프로그램 태그
    ctx.fillStyle = d.c1;
    ctx.beginPath();
    ctx.moveTo(0,16); ctx.lineTo(148,16); ctx.lineTo(136,38); ctx.lineTo(0,38); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Black Han Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(d.show, 12, 31);

    // 7. 등번호 배지
    var numStr = String(d.num).length < 2 ? '0'+d.num : String(d.num);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = '48px Anton, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(numStr, W-14, 62);
    ctx.textAlign = 'left';

    // 8. NO. 텍스트 (bottom 기준으로 계산 - CSS card-info: bottom:0, padding-bottom:24)
    // 스탯 3줄(행운까지): row0~row2 = 3rows * 14px = 42px, + 구분선 + 여백 등 총 약 90px
    // 이름~워터마크 전체 블록 높이 ≈ 140px, bottom에서 24px 패딩
    var blockBottom = H - 24;           // 워터마크 기준선
    var statH = 3 * 14 + 10;            // 스탯 3행 + 상단 여백
    var dividerY = blockBottom - statH; // 구분선 Y
    var noY  = dividerY - 62;           // NO. 텍스트
    var nameY = dividerY - 30;          // 이름
    var subY  = dividerY - 14;          // 나이·직업·키

    ctx.fillStyle = d.c1;
    ctx.font = '9px "Black Han Sans", sans-serif';
    ctx.letterSpacing = '3px';
    ctx.fillText('NO. '+numStr+' · '+d.show, 16, noY);

    // 9. 이름
    ctx.fillStyle = '#fff';
    ctx.font = '600 26px Pretendard, "Noto Sans KR", sans-serif';
    ctx.letterSpacing = '1px';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    ctx.fillText(d.name, 16, nameY);
    ctx.shadowBlur = 0;

    // 10. 나이·직업·키
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '10px Pretendard, "Noto Sans KR", sans-serif';
    ctx.letterSpacing = '1px';
    ctx.fillText(d.age+'세  ·  '+d.job+'  ·  '+d.height+'cm', 16, subY);

    // 11. 구분선
    var lineY = dividerY;
    var g2 = ctx.createLinearGradient(16,0,W-16,0);
    g2.addColorStop(0,d.c1); g2.addColorStop(0.7,'rgba(255,255,255,0.15)'); g2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle = g2; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(16,lineY); ctx.lineTo(W-16,lineY); ctx.stroke();

    // 12. 스탯 하트
    var LBLS = ['신체','민첩','집중','기술','행운'];
    var statStartY = lineY + 6;
    if (d.stats) {
      for (var i = 0; i < d.stats.length; i++) {
        var col2 = i % 2, row2 = Math.floor(i / 2);
        var sx2 = 16 + col2 * (W/2);
        var sy2 = statStartY + row2 * 14;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = '9px "Black Han Sans", sans-serif';
        ctx.letterSpacing = '1px';
        ctx.fillText(LBLS[i], sx2, sy2+9);
        for (var n = 1; n <= 5; n++) {
          ctx.fillStyle = n <= d.stats[i] ? d.c1 : 'rgba(255,255,255,0.2)';
          ctx.font = '11px sans-serif';
          ctx.fillText(n<=d.stats[i]?'♥':'♡', sx2+30+(n-1)*12, sy2+9);
        }
      }
    }

    // 13. 워터마크
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = '9px "Black Han Sans", sans-serif';
    ctx.letterSpacing = '3px';
    ctx.textAlign = 'right';
    ctx.fillText(d.show, W-14, blockBottom);

    ctx.restore();

    // 저장
    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'tryout_'+(d.name||'card')+'.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }, 'image/png');
  }

  if (d.photo) {
    var img = new Image();
    img.onload = function() { render(img); };
    img.onerror = function() { render(null); };
    img.src = d.photo;
  } else {
    render(null);
  }
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target===this) closeModal();
});

loadCast();
renderGrid();
</script>
