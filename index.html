<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRYOUT · 소개 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Bebas+Neue&family=Anton&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1B2A4A; --navy-dark: #0f1a2e; --navy-mid: #1e3260;
  --pink: #F0406A; --pink-light: #ff6b8a;
  --cream: #f5f0e8; --bg: #e8e0d4; --panel: #f5f0e8;
  --border: rgba(27,42,74,0.12); --text: #1B2A4A; --muted: #8a7f72;
}
body {
  background: #ddd6c8; color: var(--text);
  font-family: 'Pretendard','Noto Sans KR',sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 28px 14px 60px; gap: 24px;
}

/* HEADER */
.header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.logo-tryout {
  font-family: 'Anton', sans-serif; font-size: 48px; letter-spacing: 6px;
  color: #1B2A4A; -webkit-text-stroke: 2px var(--pink); line-height: 1;
}
.logo-tryout span { color: var(--pink); -webkit-text-stroke: 0; }
.logo-sub { font-size: 10px; letter-spacing: 4px; color: #8a7f72; text-transform: uppercase; }

/* TOOLBAR */
.cast-toolbar {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 960px; flex-wrap: wrap; justify-content: space-between;
}
.btn-add {
  display: flex; align-items: center; gap: 7px;
  background: linear-gradient(90deg, var(--pink), #d42d5a);
  border: none; border-radius: 10px; color: #fff;
  font-family: 'Black Han Sans', sans-serif;
  font-size: 13px; letter-spacing: 3px; cursor: pointer;
  padding: 11px 20px; box-shadow: 0 4px 16px rgba(240,64,106,0.3);
  -webkit-tap-highlight-color: transparent;
}
.btn-add:active { transform: scale(0.97); }
.btn-clear-all {
  background: transparent; border: 1.5px solid rgba(27,42,74,0.2);
  border-radius: 10px; color: rgba(27,42,74,0.45);
  font-family: 'Pretendard', sans-serif;
  font-size: 12px; cursor: pointer; padding: 11px 16px;
  -webkit-tap-highlight-color: transparent;
}

/* CAST GRID */
.cast-grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; width: 100%; max-width: 960px; }
.cast-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cast-item-actions { display: flex; gap: 6px; }
.cast-item-actions button {
  border: none; border-radius: 8px; font-family: 'Pretendard', sans-serif;
  font-size: 11px; padding: 6px 11px; cursor: pointer; letter-spacing: 0.5px;
  -webkit-tap-highlight-color: transparent;
}
.btn-edit-cast { background: var(--navy); color: #fff; }
.btn-dl-cast { background: rgba(240,64,106,0.15); color: var(--pink); border: 1px solid rgba(240,64,106,0.3) !important; }
.btn-del-cast { background: rgba(27,42,74,0.08); color: rgba(27,42,74,0.45); }

.cast-empty { text-align: center; padding: 48px 20px; color: rgba(27,42,74,0.3); font-size: 14px; letter-spacing: 1px; }
.cast-empty .empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 100;
  align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-inner {
  background: #ddd6c8; border-radius: 20px; padding: 20px 14px 32px;
  width: 100%; max-width: 420px; margin: auto;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  position: relative;
}
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: rgba(27,42,74,0.08); border: none; border-radius: 50%;
  width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--navy);
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

/* CARD (원본 그대로) */
.card {
  width: 300px; height: 560px; border-radius: 16px;
  overflow: hidden; position: relative; flex-shrink: 0;
  box-shadow: 0 0 0 1.5px rgba(27,42,74,0.15), 4px 4px 0 rgba(27,42,74,0.08), 0 16px 40px rgba(27,42,74,0.25);
}
.card-jersey-lines { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.card-stripe { position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 6; display: flex; }
.card-stripe-left { flex: 1; background: var(--pink); }
.card-stripe-right { flex: 1; background: var(--navy-mid); }
.card-tag {
  position: absolute; top: 16px; left: 0; z-index: 6;
  background: var(--pink); padding: 4px 14px 4px 12px;
  clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
  font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 3px; color: #fff;
}
.card-number-badge {
  position: absolute; top: 12px; right: 14px; z-index: 6;
  font-family: 'Anton', sans-serif; font-size: 48px; line-height: 1;
  color: rgba(27,42,74,0.07); letter-spacing: -2px;
}
.photo-area { width: 100%; height: 65%; position: relative; overflow: hidden; }
.photo-area img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.gradient-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.photo-empty { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.photo-empty svg { opacity: 0.25; stroke: #1B2A4A; }
.photo-empty span { font-size: 10px; color: var(--muted); letter-spacing: 2px; }
.card-cut { display: none; }
.card-info {
  position: absolute; top: 72%; bottom: 0; left: 0; right: 0;
  padding: 2px 16px 24px; display: flex; flex-direction: column;
  justify-content: flex-end; gap: 0; z-index: 5;
}
.card-position { font-family: 'Black Han Sans', sans-serif; font-size: 10px; letter-spacing: 4px; color: var(--pink); }
.card-name { font-family: 'Pretendard', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; line-height: 1; color: #1B2A4A; text-shadow: 0 1px 4px rgba(245,240,232,0.8); }
.card-age-job { font-family: 'Pretendard', sans-serif; font-size: 11px; color: #1B2A4A; letter-spacing: 1px; margin-top: 2px; opacity: 0.6; display: flex; gap: 10px; align-items: center; }
.card-divider { height: 1px; background: linear-gradient(90deg, var(--pink) 0%, rgba(27,42,74,0.15) 70%, transparent 100%); margin: 3px 0; }
.card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.stat-row { display: flex; align-items: center; gap: 6px; }
.stat-lbl { font-family: 'Black Han Sans', sans-serif; font-size: 9px; letter-spacing: 1.5px; color: #1B2A4A; width: 30px; flex-shrink: 0; }
.stat-num { font-family: 'Anton', sans-serif; font-size: 10px; color: rgba(255,255,255,0.6); width: 18px; text-align: right; flex-shrink: 0; }
.card-logo { position: absolute; bottom: 12px; right: 14px; font-family: 'Black Han Sans', sans-serif; font-size: 9px; letter-spacing: 3px; color: rgba(27,42,74,0.12); z-index: 6; }
.card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255,255,255,0.35) 0%, transparent 55%); z-index: 9; pointer-events: none; }

/* PANEL (원본 그대로) */
.panel { width: 100%; max-width: 400px; background: #faf7f2; border: 1px solid rgba(27,42,74,0.1); border-radius: 16px; box-shadow: 0 2px 16px rgba(27,42,74,0.1); padding: 22px 18px; display: flex; flex-direction: column; gap: 20px; }
.sec-title { font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid rgba(27,42,74,0.1); margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: rgba(27,42,74,0.5); }
input[type=text], input[type=number] { background: #fff; border: 1px solid rgba(27,42,74,0.15); border-radius: 8px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; padding: 10px 12px; outline: none; width: 100%; -webkit-appearance: none; }
input[type=text]:focus, input[type=number]:focus { border-color: var(--pink); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.color-field { display: flex; align-items: center; gap: 8px; }
.color-field label { font-size: 11px; color: rgba(27,42,74,0.5); width: 58px; flex-shrink: 0; margin: 0; }
input[type=color] { width: 36px; height: 34px; border: 1px solid rgba(27,42,74,0.15); border-radius: 6px; padding: 2px; background: #fff; cursor: pointer; flex-shrink: 0; -webkit-appearance: none; }
.hex-inp { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; padding: 8px 10px; outline: none; -webkit-appearance: none; }
.hex-inp:focus { border-color: var(--pink); }
.col-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(27,42,74,0.15); flex-shrink: 0; }
.upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; background: rgba(27,42,74,0.03); border: 1.5px dashed rgba(27,42,74,0.2); border-radius: 12px; cursor: pointer; font-size: 14px; color: rgba(27,42,74,0.45); letter-spacing: 1px; text-align: center; -webkit-tap-highlight-color: transparent; min-height: 64px; transition: border-color 0.2s, background 0.2s; }
.upload-label:active { border-color: var(--pink); background: rgba(240,64,106,0.07); }
.upload-label.loaded { border-color: rgba(27,42,74,0.25); background: rgba(27,42,74,0.04); }
.thumb-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.photo-thumb { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.thumb-text { flex: 1; font-size: 12px; color: rgba(27,42,74,0.55); }
.btn-remove { background: rgba(240,64,106,0.2); border: none; border-radius: 6px; color: var(--pink); font-size: 12px; padding: 5px 10px; cursor: pointer; flex-shrink: 0; }
.stat-ctrl-row { display: flex; align-items: center; gap: 10px; }
.stat-ctrl-label { font-family: 'Black Han Sans', sans-serif; font-size: 11px; letter-spacing: 1px; color: rgba(27,42,74,0.55); width: 50px; flex-shrink: 0; }
.stat-boxes { display: flex; gap: 5px; }
.stat-box { width: 34px; height: 34px; border: 1.5px solid rgba(27,42,74,0.2); border-radius: 7px; cursor: pointer; background: rgba(27,42,74,0.04); -webkit-tap-highlight-color: transparent; transition: background 0.12s, border-color 0.12s, transform 0.1s; }
.stat-box.on { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 8px rgba(240,64,106,0.5); }
.stat-box:active { transform: scale(0.9); }
.btn-dl { width: 100%; padding: 15px; background: linear-gradient(90deg, var(--pink), #d42d5a); border: none; border-radius: 12px; color: #fff; font-family: 'Black Han Sans', sans-serif; font-size: 15px; letter-spacing: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 20px rgba(240,64,106,0.35); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-tryout">TRY<span>&#9825;</span>UT</div>
  <div class="logo-sub">너와의 첫 매치를 시작합니다 · Profile Card</div>
</div>

<!-- TOOLBAR -->
<div class="cast-toolbar">
  <button class="btn-add" onclick="openModal()">＋ 출연자 추가</button>
  <button class="btn-clear-all" onclick="clearAll()">전체 초기화</button>
</div>

<!-- CAST GRID -->
<div class="cast-grid" id="castGrid">
  <div class="cast-empty" id="castEmpty">
    <span class="empty-icon">&#9825;</span>
    출연자를 추가해보세요
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>

    <!-- CARD PREVIEW -->
    <div class="card" id="card">
      <div class="card-jersey-lines"></div>
      <div class="card-stripe">
        <div class="card-stripe-left" id="stripeLeft"></div>
        <div class="card-stripe-right" id="stripeRight"></div>
      </div>
      <div class="card-tag" id="cardTag">TRYOUT</div>
      <div class="card-number-badge" id="cardBadge">01</div>
      <div class="photo-area" id="photoArea">
        <div class="photo-empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="12" cy="10" r="3"/>
            <path d="M3 20c0-3 3-5 9-5s9 2 9 5"/>
          </svg>
          <span>사진을 넣어보세요</span>
        </div>
      </div>
      <div class="card-cut" id="cardCut"></div>
      <div class="gradient-overlay" id="gradientOverlay" style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>
      <div class="card-info">
        <div style="display:flex;flex-direction:column;justify-content:flex-end;">
          <div class="card-position" id="cPos">NO. 01 · TRYOUT 2026</div>
          <div style="height:12px;"></div>
          <div class="card-name" id="cName">김지우</div>
          <div style="height:10px;"></div>
          <div class="card-age-job" id="cSub"><span id="cAge">24세</span><span style="opacity:0.4;margin:0 2px;">·</span><span id="cJob">인테리어 디자이너</span><span style="opacity:0.4;margin:0 2px;">·</span><span id="cHeight">168cm</span></div>
          <div style="height:16px;"></div>
        </div>
        <div class="card-divider"></div>
        <div style="display:flex;flex-direction:column;justify-content:flex-start;">
          <div style="height:10px;"></div>
          <div class="card-stats" id="cStats"></div>
          <div style="height:6px;"></div>
          <div class="card-logo" id="cLogo" style="position:static;text-align:right;font-family:'Black Han Sans',sans-serif;font-size:9px;letter-spacing:3px;color:rgba(27,42,74,0.2);"></div>
        </div>
      </div>
    </div>

    <!-- PANEL -->
    <div class="panel">
      <div>
        <div class="sec-title">기본 정보</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
          <div class="field"><label>이름</label><input type="text" id="iName" value="김지우" oninput="sync()"></div>
          <div class="row2">
            <div class="field"><label>나이</label><input type="number" id="iAge" value="24" min="18" max="60" oninput="sync()"></div>
            <div class="field"><label>키 (cm)</label><input type="number" id="iHeight" value="168" min="140" max="220" oninput="sync()"></div>
          </div>
          <div class="field"><label>직업</label><input type="text" id="iJob" value="인테리어 디자이너" oninput="sync()"></div>
          <div class="row2">
            <div class="field"><label>등번호</label><input type="text" id="iNum" value="01" oninput="sync()"></div>
            <div class="field"><label>프로그램명</label><input type="text" id="iShow" value="TRYOUT 2026" oninput="sync()"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title">카드 색상</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          <div class="color-field">
            <label>메인</label>
            <input type="color" id="c1p" value="#F0406A" oninput="pickerChange('c1',this.value)">
            <input type="text" class="hex-inp" id="c1h" value="#F0406A" oninput="hexChange('c1',this.value)" maxlength="7" placeholder="#F0406A">
            <div class="col-dot" id="c1d" style="background:#F0406A"></div>
          </div>
          <div class="color-field">
            <label>포인트</label>
            <input type="color" id="c2p" value="#1B2A4A" oninput="pickerChange('c2',this.value)">
            <input type="text" class="hex-inp" id="c2h" value="#1B2A4A" oninput="hexChange('c2',this.value)" maxlength="7" placeholder="#1B2A4A">
            <div class="col-dot" id="c2d" style="background:#1B2A4A"></div>
          </div>
          <div class="color-field">
            <label>배경</label>
            <input type="color" id="cbp" value="#f5f0e8" oninput="pickerChange('cb',this.value)">
            <input type="text" class="hex-inp" id="cbh" value="#f5f0e8" oninput="hexChange('cb',this.value)" maxlength="7" placeholder="#f5f0e8">
            <div class="col-dot" id="cbd" style="background:#f5f0e8"></div>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title">사진</div>
        <div style="margin-top:10px;">
          <label class="upload-label" id="uploadLabel" for="fileInput">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>탭하여 사진 선택</span>
          </label>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileChange(this)">
        </div>
      </div>
      <div>
        <div class="sec-title">스탯</div>
        <div id="statWrap" style="display:flex;flex-direction:column;gap:9px;margin-top:10px;"></div>
      </div>
      <button class="btn-dl" onclick="saveAndClose()">&#10004; 저장</button>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var col = { c1:'#F0406A', c2:'#1B2A4A', cb:'#f5f0e8' };
var photoUrl = null;

var STATS = [
  {key:'body',  lbl:'신체', val:3},
  {key:'agil',  lbl:'민첩', val:4},
  {key:'focus', lbl:'집중', val:3},
  {key:'skill', lbl:'기술', val:5},
  {key:'luck',  lbl:'행운', val:2}
];

/* stat box UI 생성 */
var wrap = document.getElementById('statWrap');
STATS.forEach(function(s, i) {
  var d = document.createElement('div');
  d.className = 'stat-ctrl-row';
  var boxes = '';
  for (var n = 1; n <= 5; n++) {
    boxes += '<div class="stat-box' + (n <= s.val ? ' on' : '') + '" onclick="setStat(' + i + ',' + n + ')" id="box_' + s.key + '_' + n + '"></div>';
  }
  d.innerHTML = '<span class="stat-ctrl-label">' + s.lbl + '</span><div class="stat-boxes">' + boxes + '</div>';
  wrap.appendChild(d);
});

function setStat(i, v) {
  STATS[i].val = v;
  var s = STATS[i];
  for (var n = 1; n <= 5; n++) {
    var el = document.getElementById('box_' + s.key + '_' + n);
    if (el) el.className = 'stat-box' + (n <= v ? ' on' : '');
  }
  renderStats();
}

/* color */
function validHex(h) { return /^#[0-9A-Fa-f]{6}$/.test(h); }
function pickerChange(k, v) {
  col[k] = v;
  document.getElementById(k + 'h').value = v;
  document.getElementById(k + 'd').style.background = v;
  sync();
}
function hexChange(k, raw) {
  var v = raw.trim();
  if (v && v[0] !== '#') v = '#' + v;
  if (validHex(v)) {
    col[k] = v;
    document.getElementById(k + 'p').value = v;
    document.getElementById(k + 'd').style.background = v;
    sync();
  }
}

/* photo */
function onFileChange(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) { photoUrl = e.target.result; setPhoto(); };
  reader.readAsDataURL(file);
}
function setPhoto() {
  var area = document.getElementById('photoArea');
  area.innerHTML = '';
  var img = document.createElement('img');
  img.src = photoUrl;
  area.appendChild(img);
  var lbl = document.getElementById('uploadLabel');
  lbl.classList.add('loaded');
  lbl.innerHTML =
    '<div class="thumb-row">' +
    '<img class="photo-thumb" src="' + photoUrl + '">' +
    '<span class="thumb-text">사진 변경하려면 탭</span>' +
    '<button class="btn-remove" onclick="clearPhoto(event)">제거</button>' +
    '</div>';
}
function clearPhoto(e) {
  if (e && e.preventDefault) e.preventDefault();
  photoUrl = null;
  var fi = document.getElementById('fileInput');
  if (fi) fi.value = '';
  document.getElementById('photoArea').innerHTML =
    '<div class="photo-empty">' +
    '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.2">' +
    '<rect x="3" y="3" width="18" height="18" rx="3"/>' +
    '<circle cx="12" cy="10" r="3"/>' +
    '<path d="M3 20c0-3 3-5 9-5s9 2 9 5"/>' +
    '</svg><span>사진을 넣어보세요</span></div>';
  var lbl = document.getElementById('uploadLabel');
  lbl.classList.remove('loaded');
  lbl.innerHTML =
    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">' +
    '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
    '<polyline points="17 8 12 3 7 8"/>' +
    '<line x1="12" y1="3" x2="12" y2="15"/>' +
    '</svg><span>탭하여 사진 선택</span>';
}

/* sync */
function sync() {
  var name = document.getElementById('iName').value || '이름';
  var age = document.getElementById('iAge').value;
  var job = document.getElementById('iJob').value;
  var num = document.getElementById('iNum').value;
  var show = document.getElementById('iShow').value;
  var c1 = col.c1, c2 = col.c2, cb = col.cb;
  var numStr = String(num).length < 2 ? '0' + num : num;

  document.getElementById('stripeLeft').style.background = c1;
  document.getElementById('stripeRight').style.background = c2;
  document.getElementById('cardCut').style.background = cb;
  document.getElementById('cardTag').textContent = show;
  document.getElementById('cardBadge').textContent = numStr;
  document.getElementById('cName').textContent = name;
  document.getElementById('cAge').textContent = age + '세';
  document.getElementById('cJob').textContent = job;
  document.getElementById('cHeight').textContent = document.getElementById('iHeight').value + 'cm';
  document.getElementById('cPos').textContent = 'NO. ' + numStr + ' · ' + show;
  document.getElementById('cPos').style.color = c1;
  document.getElementById('cLogo').textContent = show;

  var r = parseInt(cb.slice(1,3),16), g = parseInt(cb.slice(3,5),16), b = parseInt(cb.slice(5,7),16);
  function rgba(a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
  document.getElementById('gradientOverlay').style.background =
    'linear-gradient(to bottom,' + rgba(0) + ' 0%,' + rgba(0) + ' 42%,' +
    rgba(0.06) + ' 52%,' + rgba(0.2) + ' 58%,' + rgba(0.5) + ' 65%,' +
    rgba(0.85) + ' 72%,' + rgba(1) + ' 78%,' + rgba(1) + ' 100%)';
  document.getElementById('photoArea').style.background = cb;
  document.getElementById('card').style.background = cb;
  renderStats();
}

function renderStats() {
  var c1 = col.c1;
  var el = document.getElementById('cStats');
  el.innerHTML = '';
  STATS.forEach(function(s) {
    var hearts = '';
    for (var n = 1; n <= 5; n++) {
      var filled = n <= s.val;
      hearts += '<span style="font-size:15px;color:' + (filled ? c1 : 'rgba(27,42,74,0.18)') + ';line-height:1;transition:color 0.2s;">' + (filled ? '♥' : '♡') + '</span>';
    }
    var row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = '<span class="stat-lbl">' + s.lbl + '</span><span style="flex:1;display:flex;align-items:center;gap:2px;">' + hearts + '</span>';
    el.appendChild(row);
  });
}

/* ─── 다중 출연자 관리 ─── */
var castList = [];
var editingIdx = -1;

function loadCast() {
  try {
    var s = localStorage.getItem('tryout_cast');
    if (s) castList = JSON.parse(s);
  } catch(e) { castList = []; }
}
function saveCast() {
  try { localStorage.setItem('tryout_cast', JSON.stringify(castList)); } catch(e) {}
}

function openModal(idx) {
  editingIdx = (idx !== undefined) ? idx : -1;
  var d = editingIdx >= 0 ? castList[editingIdx] : null;

  document.getElementById('iName').value   = d ? d.name   : '';
  document.getElementById('iAge').value    = d ? d.age    : '24';
  document.getElementById('iHeight').value = d ? d.height : '168';
  document.getElementById('iJob').value    = d ? d.job    : '';
  document.getElementById('iNum').value    = d ? d.num    : '01';
  document.getElementById('iShow').value   = d ? d.show   : 'TRYOUT 2026';

  col = { c1: d ? d.c1 : '#F0406A', c2: d ? d.c2 : '#1B2A4A', cb: d ? d.cb : '#f5f0e8' };
  ['c1','c2','cb'].forEach(function(k) {
    var p = document.getElementById(k+'p'), h = document.getElementById(k+'h'), dot = document.getElementById(k+'d');
    if(p) p.value = col[k]; if(h) h.value = col[k]; if(dot) dot.style.background = col[k];
  });

  photoUrl = d ? (d.photo || null) : null;
  if (photoUrl) setPhoto(); else clearPhoto(null);

  if (d && d.stats) {
    STATS.forEach(function(s, i) { setStat(i, d.stats[i] !== undefined ? d.stats[i] : s.val); });
  } else {
    STATS.forEach(function(s, i) { setStat(i, s.val); });
  }

  document.getElementById('modalOverlay').classList.add('open');
  sync();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function saveAndClose() {
  var data = {
    name:   document.getElementById('iName').value || '이름없음',
    age:    document.getElementById('iAge').value,
    height: document.getElementById('iHeight').value,
    job:    document.getElementById('iJob').value,
    num:    document.getElementById('iNum').value || '01',
    show:   document.getElementById('iShow').value || 'TRYOUT 2026',
    c1: col.c1, c2: col.c2, cb: col.cb,
    photo: photoUrl || null,
    stats: STATS.map(function(s) { return s.val; })
  };
  if (editingIdx >= 0) castList[editingIdx] = data;
  else castList.push(data);
  saveCast();
  renderGrid();
  closeModal();
}

function deleteCard(idx) {
  if (!confirm('이 출연자를 삭제할까요?')) return;
  castList.splice(idx, 1);
  saveCast();
  renderGrid();
}

function clearAll() {
  if (castList.length === 0) return;
  if (!confirm('모든 출연자를 초기화할까요?')) return;
  castList = [];
  saveCast();
  renderGrid();
}

function renderGrid() {
  var grid = document.getElementById('castGrid');
  var empty = document.getElementById('castEmpty');
  if (castList.length === 0) {
    grid.innerHTML = '';
    grid.appendChild(empty);
    return;
  }
  grid.innerHTML = '';
  castList.forEach(function(d, idx) {
    var item = document.createElement('div');
    item.className = 'cast-item';
    var cardDiv = document.createElement('div');
    cardDiv.id = 'castcard_' + idx;
    cardDiv.innerHTML = buildCardHTML(d);
    applyCardStyle(cardDiv, d);
    item.appendChild(cardDiv);
    var actions = document.createElement('div');
    actions.className = 'cast-item-actions';
    actions.innerHTML =
      '<button class="btn-edit-cast" onclick="openModal(' + idx + ')">수정</button>' +
      '<button class="btn-dl-cast" onclick="downloadCard(' + idx + ')">&#11015; 저장</button>' +
      '<button class="btn-del-cast" onclick="deleteCard(' + idx + ')">삭제</button>';
    item.appendChild(actions);
    grid.appendChild(item);
  });
}

function buildCardHTML(d) {
  var numStr = String(d.num).length < 2 ? '0' + d.num : String(d.num);
  var photoHtml = d.photo
    ? '<img src="' + d.photo + '" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block;">'
    : '<div class="photo-empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M3 20c0-3 3-5 9-5s9 2 9 5"/></svg><span>사진없음</span></div>';

  var c1 = d.c1;
  var statsHtml = '';
  if (d.stats) {
    var LBLS = ['신체','민첩','집중','기술','행운'];
    for (var i = 0; i < 5; i++) {
      var v = d.stats[i] || 0;
      var hearts = '';
      for (var n = 1; n <= 5; n++) {
        hearts += '<span style="font-size:15px;color:' + (n<=v ? c1 : 'rgba(27,42,74,0.18)') + ';line-height:1;">' + (n<=v ? '♥':'♡') + '</span>';
      }
      statsHtml += '<div class="stat-row"><span class="stat-lbl">' + LBLS[i] + '</span><span style="flex:1;display:flex;align-items:center;gap:2px;">' + hearts + '</span></div>';
    }
  }

  return '<div class="card-jersey-lines"></div>' +
    '<div class="card-stripe"><div class="card-stripe-left" style="background:' + d.c1 + '"></div><div class="card-stripe-right" style="background:' + d.c2 + '"></div></div>' +
    '<div class="card-tag" style="background:' + d.c1 + '">' + d.show + '</div>' +
    '<div class="card-number-badge">' + numStr + '</div>' +
    '<div class="photo-area" style="background:' + d.cb + ';">' + photoHtml + '</div>' +
    '<div class="gradient-overlay" id="go_' + d.name + '_' + (Date.now()%9999) + '" style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>' +
    '<div class="card-info">' +
      '<div style="display:flex;flex-direction:column;justify-content:flex-end;">' +
        '<div class="card-position" style="color:' + d.c1 + '">NO. ' + numStr + ' · ' + d.show + '</div>' +
        '<div style="height:12px;"></div>' +
        '<div class="card-name">' + d.name + '</div>' +
        '<div style="height:10px;"></div>' +
        '<div class="card-age-job"><span>' + d.age + '세</span><span style="opacity:0.4;margin:0 2px;">·</span><span>' + d.job + '</span><span style="opacity:0.4;margin:0 2px;">·</span><span>' + d.height + 'cm</span></div>' +
        '<div style="height:16px;"></div>' +
      '</div>' +
      '<div class="card-divider" style="background:linear-gradient(90deg,' + d.c1 + ' 0%,rgba(27,42,74,0.15) 70%,transparent 100%);"></div>' +
      '<div style="display:flex;flex-direction:column;justify-content:flex-start;">' +
        '<div style="height:10px;"></div>' +
        '<div class="card-stats">' + statsHtml + '</div>' +
        '<div style="height:6px;"></div>' +
        '<div style="text-align:right;font-family:\'Black Han Sans\',sans-serif;font-size:9px;letter-spacing:3px;color:rgba(27,42,74,0.2);">' + d.show + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card-logo">' + d.show + '</div>';
}

function applyCardStyle(el, d) {
  el.className = 'card';
  el.style.background = d.cb;
  var r = parseInt(d.cb.slice(1,3),16), g = parseInt(d.cb.slice(3,5),16), b = parseInt(d.cb.slice(5,7),16);
  function rgba(a) { return 'rgba('+r+','+g+','+b+','+a+')'; }
  var grad = 'linear-gradient(to bottom,' + rgba(0) + ' 0%,' + rgba(0) + ' 42%,' + rgba(0.06) + ' 52%,' + rgba(0.2) + ' 58%,' + rgba(0.5) + ' 65%,' + rgba(0.85) + ' 72%,' + rgba(1) + ' 78%,' + rgba(1) + ' 100%)';
  var go = el.querySelector('.gradient-overlay');
  if (go) go.style.background = grad;
  var pa = el.querySelector('.photo-area');
  if (pa) pa.style.background = d.cb;
}

function downloadCard(idx) {
  var el = document.getElementById('castcard_' + idx);
  if (!el) return;
  html2canvas(el, { scale:3, useCORS:true, allowTaint:true, backgroundColor:null, logging:false }).then(function(canvas) {
    var a = document.createElement('a');
    a.download = 'tryout_' + (castList[idx].name || 'card') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

/* modal 바깥 클릭 닫기 */
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* 초기화 */
loadCast();
renderGrid();
sync();
</script>
</body>
</html>
